include:
  - project: 'infinity-economics/iep-release'
    ref: develop
    file: '/templates/docker-build-publish.yml'

download-artifacts:
  stage: prepare
  tags:
    - ci-cd
  script:
    - ls -alt build
  needs:
    - project: infinity-economics/iep-wallet-ui
      # UPSTREAM_REF comes from the iep-release template: this branch on
      # develop/master, the default branch elsewhere. ${CI_COMMIT_REF_NAME}
      # would point at a branch that usually does not exist in iep-wallet-ui.
      ref: $UPSTREAM_REF
      job: docker-build
      artifacts: true
  artifacts:
    paths:
      - build/

docker-build:
  stage: build
  tags:
    - ci-cd
  before_script:
      - apk add --update --no-cache git curl bash
      - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
      - export WALLET_UI_BUILD_FILE=/builds/infinity-economics/iep-node/build/iep-wallet-ui.zip
      - ls -alt build/
  artifacts:
    paths:
      - build/iep-node.tar
      - build/iep-node.zip
      # carry the stamped version forward so dockerhub-/gitlab-publish tag the
      # candidate (X.Y.Z-rc.<iid>) instead of the committed X.Y.Z
      - release-version.txt
prepare-iep-node-artifacts:
  stage: publish
  tags:
    - ci-cd
  needs: ["docker-build"]
  script:
      - mkdir -p iep-node-artifacts/build
      - cp build/iep-node.zip iep-node-artifacts/build
      - mkdir -p iep-node-artifacts/src/main/resources
      - cp src/main/resources/system.properties iep-node-artifacts/src/main/resources
      - cp src/main/resources/log4j2.xml iep-node-artifacts/src/main/resources
      - mkdir -p iep-node-artifacts/conf
      - cp conf/mainnet.properties iep-node-artifacts/conf
      - cp conf/testnet.properties iep-node-artifacts/conf
      - cp conf/devnet.properties iep-node-artifacts/conf
      - cp conf/custom.properties iep-node-artifacts/conf
      - mkdir -p iep-node-artifacts/conf/templates
      - cp conf/templates/installer.properties iep-node-artifacts/conf/templates
      # the installer's info panel opens CHANGELOG-<xin.version>.md
      - cp CHANGELOG.md "iep-node-artifacts/CHANGELOG-$(sed -n 's/^xin\.version=//p' src/main/resources/system.properties).md"
      - cp LICENSE.txt iep-node-artifacts
  artifacts:
    paths:
      - iep-node-artifacts

trigger-iep-node-installer:
  stage: publish
  needs: ["prepare-iep-node-artifacts"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "master"'
      when: manual
      allow_failure: true
  trigger: infinity-economics/iep-node-installer

# Auto-rebuild the deployment package after a new node image is built: iep-docker's
# download-docker-images jobs pull this pipeline's docker-build artifact
# (build/iep-node.tar). Same branch. forward:false so iep-node's variables don't
# leak into the iep-docker pipeline. iep-docker -> iep-node (build-iep-node) stays
# manual, so this does not create an auto-trigger loop. develop only: on master the
# release package comes from merging iep-docker's release MR, after all master
# images are built (iep-release release-mrs.sh); a package triggered from here
# would carry iep-docker's previous master.
trigger-iep-docker:
  stage: publish
  needs: ["docker-build"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
  trigger:
    project: infinity-economics/iep-docker
    branch: $CI_COMMIT_BRANCH
    forward:
      yaml_variables: false